name: troupe_manager
description: Application de présence scoute par QR code, hors ligne.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  intl: ^0.19.0
  share_plus: ^9.0.0
  permission_handler: ^13.0.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.5
flutter:
  uses-material-design: true
  assets:
    - assets/splash.jpeg
    - assets/icon.jpeg